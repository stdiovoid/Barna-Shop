<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>مدیریت | برنا شاپ</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body>
<header class="topbar"><a class="brand" href="barna-v2.html"><span class="brand-mark">B</span><span>BARNA <b>SHOP</b><small>پنل مدیریت فروشگاه</small></span></a><a class="telegram-link" href="barna-v2.html">مشاهده فروشگاه ↗</a></header>
<main class="admin-wrap"><div class="admin-heading"><span class="eyebrow">CONTROL CENTER</span><h1>مدیریت فروشگاه</h1></div>
<section class="admin-card" id="loginPanel"><h2>ورود مدیر</h2><label for="email">ایمیل مدیر</label><input id="email" type="email" autocomplete="username" placeholder="ایمیل حساب مدیر"><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز حساب"><button class="gold-button" id="loginBtn">ورود به پنل</button><p class="error" id="loginError"></p></section>
<section id="dashboard" hidden><div class="admin-card"><div class="card-title"><h2 id="formTitle">افزودن اکانت جدید</h2><button class="subtle-btn" id="cancelEdit" hidden>لغو ویرایش</button></div>
<form id="productForm"><input type="hidden" id="editId"><label for="title">عنوان اکانت</label><input id="title" required maxlength="90"><label for="description">توضیحات</label><textarea id="description" rows="3" maxlength="700"></textarea><div class="form-row"><div><label for="price">قیمت (تومان)</label><input id="price" type="number" min="0" required></div><div><label for="status">وضعیت</label><select id="status"><option value="available">موجود</option><option value="sold">فروخته شده</option></select></div></div><label for="images">تصاویر اکانت</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><small class="hint">تصاویر در فضای ذخیره‌سازی آنلاین ذخیره می‌شوند (حداکثر ۵ مگابایت).</small><div class="preview-row" id="imagePreview"></div><button class="gold-button" type="submit" id="saveBtn">ثبت محصول</button><p class="success" id="formMessage"></p></form></div>
<div class="admin-card"><div class="card-title"><h2>تنظیمات سفارش</h2></div><label for="orderLink">لینک روبیکا برای سفارش</label><input id="orderLink" type="url"><button class="gold-button" id="saveSettings">ذخیره تنظیمات</button></div>
<div class="admin-card"><div class="card-title"><h2>فهرست محصولات</h2><span id="adminCount" class="count"></span></div><div id="adminProducts" class="admin-products"></div></div></section></main>
<footer><div class="copyright">ساخته شده با <a href="https://rubika.ir/Studivoid">استدیو ووید</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="barna-v2-client.js"></script><script src="barna-v2-admin.js"></script></body></html>
