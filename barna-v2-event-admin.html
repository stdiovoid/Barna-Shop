<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت ایونت | برنا</title><link rel="stylesheet" href="events.css"><link rel="stylesheet" href="event-admin.css"></head><body>
<header class="topbar"><a class="brand" href="barna-v2-events.html"><span class="mark">B</span><span>BARNA <b>ARENA</b><small>پنل مدیریت مسابقات</small></span></a><a href="barna-v2-events.html">صفحه ایونت‌ها ↗</a></header>
<main class="admin-wrap"><div class="admin-heading"><span class="eyebrow">ARENA CONTROL</span><h1>مدیریت ایونت‌ها</h1></div>
<section class="admin-card" id="login"><h2>ورود مدیر</h2><label>ایمیل مدیر</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button class="gold-btn" id="loginBtn">ورود</button><p id="loginError" class="error"></p></section><div id="dash" hidden>
<section class="admin-card"><h2 id="formHeading">ساخت ایونت</h2><form id="eventForm"><input id="editId" type="hidden"><label>عنوان ایونت</label><input id="title" required maxlength="90"><label>توضیحات</label><textarea id="description" rows="3"></textarea><div class="form-row"><div><label>تاریخ نمایشی</label><input id="date" placeholder="مثلاً جمعه ۳۰ آبان"></div><div><label>ساعت</label><input id="time" type="time" value="23:00"></div></div><div class="form-row"><div><label>جایزه</label><input id="prize"></div><div><label>ورودی (تومان؛ رایگان = صفر)</label><input id="fee" type="number" min="0" value="0"></div></div><div class="form-row"><div><label>ظرفیت بازیکن</label><input id="capacity" type="number" min="1"></div><div><label>نفر در هر تیم</label><input id="teamSize" type="number" min="1" max="10" value="4"></div></div><label>قوانین</label><textarea id="rules" rows="4"></textarea><label>پوستر ایونت</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><div id="preview" class="preview"></div><button class="gold-btn">ذخیره ایونت</button><button type="button" class="subtle" id="cancel" hidden>لغو ویرایش</button><p id="formMsg" class="success"></p></form></section>
<section class="admin-card"><h2>ایونت‌های ثبت‌شده</h2><div id="eventList"></div></section>
<section class="admin-card"><h2>درخواست شرکت‌کنندگان</h2><label>انتخاب ایونت</label><select id="filterEvent"></select><label>وضعیت</label><select id="filterStatus"><option value="pending">در انتظار</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="all">همه</option></select><div id="registrations"></div><button class="gold-btn" id="draw">قرعه‌کشی تیم‌های رندوم</button><div id="teams" class="teams"></div></section>
<section class="admin-card"><h2>کد روم و اعلام برنده</h2><label>ایونت</label><select id="resultEvent"></select><label>کد روم</label><input id="room"><label class="check"><input id="revealRoom" type="checkbox"> نمایش کد روم در صفحه عمومی</label><label>برنده (اسم کالاف یا UID)</label><input id="winner"><label>پیام برنده</label><textarea id="winnerMsg" rows="3"></textarea><label class="check"><input id="publishWinner" type="checkbox"> انتشار نتیجه برای همه</label><button class="gold-btn" id="saveResult">ذخیره نتیجه</button><p id="resultMsg" class="success"></p><p>برای دریافت جایزه: <a href="https://rubika.ir/borna_tde" target="_blank" rel="noopener">@borna_tde</a></p></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="barna-v2-client.js"></script><script src="event-barna-v2-admin.js"></script></body></html>
